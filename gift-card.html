<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salon Gift Cards</title>
    <style>
        .salon-giftcard-section {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
            background-color: #faf9f6;
            min-height: 70vh;
        }

        .salon-giftcard-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 580px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .salon-giftcard-title {
            font-family: 'Playfair Display', 'Didot', serif;
            font-size: 2rem;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .salon-giftcard-subtitle {
            font-family: 'Inter', 'Helvetica Neue', sans-serif;
            font-size: 0.95rem;
            color: #666666;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .gift-up-target {
            width: 100% !important;
            margin: 0 auto;
            min-height: 300px;
        }

        @media (max-width: 480px) {
            .salon-giftcard-section {
                padding: 30px 15px;
            }

            .salon-giftcard-card {
                padding: 24px 16px;
            }

            .salon-giftcard-title {
                font-size: 1.6rem;
            }
        }
    </style>
</head>

<body>
    <div class="salon-giftcard-section">
        <div class="salon-giftcard-card">

            <h2 class="salon-giftcard-title">Purchase an E-Gift Card</h2>
            <p class="salon-giftcard-subtitle">Delivered instantly via email to your recipient.</p>

            <!-- Gift Up Target Container -->
            <div class="gift-up-target" data-site-id="5e5965af-502a-4a09-bb0f-42612d27147a" data-platform="Other"
                data-options="theme:light, mode:test"></div>

        </div>
    </div>

    <script type="text/javascript">
        (function (g, i, f, t, u, p, s) {
            g[u] = g[u] || function () { (g[u].q = g[u].q || []).push(arguments); };
            p = i.createElement(f);
            p.async = 1;
            p.src = t;
            s = i.getElementsByTagName(f)[0];
            s.parentNode.insertBefore(p, s);
        })(window, document, "script", "https://cdn.yourgift.cards/dist/gift-up.js?siteId=5e5965af-502a-4a09-bb0f-42612d27147a", "giftup");
    </script>
</body>

</html>
