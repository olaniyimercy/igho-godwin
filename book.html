<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css/index.css">
    <link rel="stylesheet" href="styles.css/book.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="shortcut icon" href="./images/favicon.jpg" type="image/x-icon">
    <title>Book Now</title>
    <script src="./scripts.js/auto-translate.js"></script>
</head>

<body>
    <div id="google_translate_element" style="display:none;"></div>

    <header>
        <div class="nav-primary">
            <h1 class="logo"><a href="./index.html">Igho Godwin</a></h1>
            <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="menu-links" id="menuLinks">
                <a href="./services.html" class="active">Salon</a>
                <a href="./book.html?category=haircuts" class="active">Haircuts</a>
                <a href="./book.html?category=treatments" class="active">Treatments</a>
                <a href="./philosophy.html" class="active">Our Philosophy</a>
                <a href="./gift-card.html" class="active">Gift card</a>
                <a href="https://ighogodwinsalong.bokadirekt.se/" class="menu-btn-solid">Book an Appointment</a>
            </nav>
        </div>

        <div class="nav-backdrop" id="navBackdrop"></div>

        <div class="sub-bar">
            <div class="sub-bar-name">Hair &amp; Scalp wellness specialist</div>
            <div class="social-top">
                <!-- Inline Text Language Links -->
                <div class="lang-switch-inline notranslate" translate="no">
                    <button class="lang-link active" id="btn-lang-en" onclick="switchLanguage('en')">ENG</button>
                    <span class="lang-divider">|</span>
                    <button class="lang-link" id="btn-lang-sv" onclick="switchLanguage('sv')">SV</button>
                </div>
            </div>
        </div>
    </header>


    <div class="booking-overlay" id="bookingOverlay">

        <div class="booking-layout">
            <div class="services-column">
                <h2 class="booking-title">Select services</h2>
                <div class="booking-breadcrumbs"><a href="./index.html">SALON</a> / SERVICES</div>

                <!-- Category Filter Pills: 'All Services' is active by default -->
                <div class="filter-pills-wrap" id="categoryPills">
                    <button class="pill-btn active" data-category="all">All Services</button>
                    <button class="pill-btn" data-category="haircuts">Haircuts</button>
                    <button class="pill-btn" data-category="treatments">Hair &amp; Scalp Treatments</button>
                </div>

                <!-- Main Container where categorized sections render -->
                <div id="serviceSectionsContainer"></div>
            </div>

        </div>
    </div>
    <script src="scripts.js/book.js"></script>
</body>

</html>
