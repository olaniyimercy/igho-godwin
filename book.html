<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css/index.css">
    <link rel="stylesheet" href="styles.css/book.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Montserrat:wght@300;400;500&display=swap"
        rel="stylesheet">
    <title>Book Now</title>
    <script src="./scripts.js/auto-translate.js"></script>
</head>

<body>
    <div id="google_translate_element" style="display:none;"></div>

    <div class="booking-overlay" id="bookingOverlay">
        <div class="booking-nav-bar">
            <button class="booking-nav-btn" onclick="window.location.href='index.html'"><svg
                    xmlns="http://www.w3.org/2000/svg" width="2.5em" height="2.5em" viewBox="0 0 512 512">
                    <path d="M0 0h512v512H0z" fill="none" />
                    <path fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="20"
                        d="M249.38 336L170 256l79.38-80m-68.35 80H342" />
                    <path fill="none" stroke="#000" stroke-miterlimit="10" stroke-width="32"
                        d="M448 256c0-106-86-192-192-192S64 150 64 256s86 192 192 192s192-86 192-192Z" />
                </svg></button>
            <button class="booking-nav-btn" onclick="window.href='#'" aria-label="Return home"></button>
        </div>

        <div class="booking-layout">
            <div class="services-column">
                <h2 class="booking-title">Select services</h2>
                <div class="booking-breadcrumbs"><a href="./index.html">SALON</a> / SERVICES</div>

                <!-- Category Filter Pills: 'All Services' is active by default -->
                <div class="filter-pills-wrap" id="categoryPills">
                    <button class="pill-btn active" data-category="all">All Services</button>
                    <button class="pill-btn" data-category="haircuts">Haircuts</button>
                    <button class="pill-btn" data-category="treatments">Hair &amp; Scalp Treatments</button>
                </div>

                <!-- Main Container where categorized sections render -->
                <div id="serviceSectionsContainer"></div>
            </div>

        </div>
    </div>
    <script src="scripts.js/book.js"></script>
</body>

</html>
